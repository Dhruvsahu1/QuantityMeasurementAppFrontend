<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Quantity Measurement</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="auth-container">
        <div class="glass-card auth-card">
            <div class="auth-header">
                <div class="auth-logo">📏</div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Sign up to start using Measurement App</p>
            </div>
            
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input 
                        type="text" 
                        id="fullName" 
                        name="fullName" 
                        class="form-input" 
                        placeholder="Enter your full name"
                        required
                        autocomplete="name"
                    >
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Create a password (min 6 characters)"
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        class="form-input" 
                        placeholder="Confirm your password"
                        required
                        autocomplete="new-password"
                    >
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                    Create Account
                </button>
            </form>
            
            <div class="auth-divider">or continue with</div>
            
            <button type="button" class="social-btn" id="googleRegBtn" onclick="handleGoogleRegister()">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>
            
            <p class="auth-footer mt-lg">
                Already have an account? 
                <a href="login.html">Sign in</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Redirect if already authenticated
            if (API.isAuthenticated()) {
                window.location.href = 'dashboard.html';
                return;
            }
            
            const registerForm = document.getElementById('registerForm');
            const fullNameInput = document.getElementById('fullName');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const fullName = fullNameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                
                // Validation
                if (!Utils.isRequired(fullName)) {
                    Utils.showError('Please enter your full name');
                    fullNameInput.focus();
                    return;
                }
                
                if (!Utils.isRequired(email)) {
                    Utils.showError('Please enter your email address');
                    emailInput.focus();
                    return;
                }
                
                if (!Utils.isValidEmail(email)) {
                    Utils.showError('Please enter a valid email address');
                    emailInput.focus();
                    return;
                }
                
                if (!Utils.isValidPassword(password)) {
                    Utils.showError('Password must be at least 6 characters');
                    passwordInput.focus();
                    return;
                }
                
                if (password !== confirmPassword) {
                    Utils.showError('Passwords do not match');
                    confirmPasswordInput.focus();
                    return;
                }
                
                try {
                    await API.register(fullName, email, password);
                    Utils.showSuccess('Registration successful! Redirecting to login...');
                    
                    // Redirect to login after short delay
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } catch (error) {
                    Utils.showError(error.message || 'Registration failed. Please try again.');
                }
            });
            
            // Clear error on input
            const inputs = [fullNameInput, emailInput, passwordInput, confirmPasswordInput];
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    input.style.borderColor = '';
                });
            });
        });
        
        // Handle Google OAuth registration - redirect full page
        function handleGoogleRegister() {
            window.location.href = `${API.BASE_URL}/oauth2/authorization/google`;
        }
    </script>
</body>
</html>
